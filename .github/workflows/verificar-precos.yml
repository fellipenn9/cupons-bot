name: Verificar preços

on:
  schedule:
    - cron: '17 */2 * * *'   # a cada 2 horas (horário UTC)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

concurrency:
  group: verificar-precos
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: node --test checker/check.test.mjs checker/radar.test.mjs
      - name: Verificar preços e avisar no Telegram
        run: node checker/check.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
